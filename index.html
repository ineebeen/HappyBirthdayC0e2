<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>너를 위한 생일 편지 💌</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 3D 회전 및 원근감 설정 */
        .stage {
            perspective: 1000px;
            width: 300px;
            height: 200px;
            position: relative;
        }

        /* 편지 봉투 컨테이너 */
        .envelope-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease, top 0.6s ease;
            cursor: pointer;
        }

        .envelope-wrapper.flipped {
            transform: rotateY(180deg);
        }

        /* 봉투 앞/뒷면 공통 */
        .envelope-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .front {
            background-image: url('envelope-front.png');
        }

        .back {
            background-image: url('envelope-back.png');
            transform: rotateY(180deg);
        }

        /* 위로 스와이프했을 때 열린 이미지로 변경 */
        .envelope-wrapper.opened .front {
            background-image: url('envelope-open.png');
        }

        /* 접힌 편지지 (봉투 안에서 위로 올라오는 부분) */
        .letter-folded {
            position: absolute;
            top: 20px;
            left: 5%;
            width: 90%;
            height: 160px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s ease;
            z-index: -1;
            font-size: 14px;
            color: #888;
        }

        .envelope-wrapper.opened .letter-folded {
            transform: translateY(-120px);
            z-index: 2;
        }

        /* 전체 화면 편지지 모달 */
        .letter-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 60px 25px 40px 25px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .letter-full.active {
            display: flex;
        }

        /* X 닫기 버튼 */
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.05);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            z-index: 101;
        }

        /* 편지 본문 텍스트 스타일 */
        .letter-content {
            font-size: 16px;
            line-height: 1.8;
            color: #2c3e50;
            word-break: keep-all;
        }

        .letter-content h1 {
            margin-bottom: 20px;
            color: #e91e63;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope-face front"></div>
            <div class="envelope-face back"></div>
            <div class="letter-folded" id="foldedLetter">
                ✉️ 터치해서 편지 펼치기
            </div>
        </div>
    </div>

    <!-- 전체 화면 편지지 -->
    <div class="letter-full" id="fullLetter">
        <div class="close-btn" id="closeBtn">✕</div>
        <div class="letter-content">
            <h1>🎉 생일 축하해!</h1>
            <p>소중한 친구에게,</p><br>
            <p>여기에 준비한 생일 편지 텍스트를 작성하시면 됩니다.</p><br>
            <p>내용이 길어지면 모바일 화면에서 손가락으로 위아래 스크롤을 하면서 읽을 수 있습니다.</p><br>
            <p>오늘 하루 행복하고 즐거운 일만 가득하길 바랄게!</p>
        </div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const foldedLetter = document.getElementById('foldedLetter');
        const fullLetter = document.getElementById('fullLetter');
        const closeBtn = document.getElementById('closeBtn');

        let startX = 0;
        let startY = 0;
        let isOpen = false;

        // 터치 이벤트 (모바일 스와이프 감지)
        envelope.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        envelope.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = endX - startX;
            const diffY = endY - startY;

            // 좌/우 스와이프 (100px 이상 움직였을 때) -> 봉투 뒷면 전환
            if (Math.abs(diffX) > 100 && Math.abs(diffY) < 50 && !isOpen) {
                envelope.classList.toggle('flipped');
            }
            
            // 위로 스와이프 (위쪽으로 80px 이상) -> 봉투 열림 및 편지지 올라옴
            if (diffY < -80 && Math.abs(diffX) < 50 && !isOpen) {
                envelope.classList.remove('flipped');
                envelope.classList.add('opened');
                isOpen = true;
            }
        });

        // 위로 올라온 접힌 편지지 터치 시 전체화면 확장
        foldedLetter.addEventListener('click', (e) => {
            if (isOpen) {
                e.stopPropagation();
                fullLetter.classList.add('active');
            }
        });

        // X 버튼 클릭 시 초기 상태로 복구
        closeBtn.addEventListener('click', () => {
            fullLetter.classList.remove('active');
            envelope.classList.remove('opened');
            isOpen = false;
        });
    </script>
</body>
</html>
