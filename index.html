<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>최팡만 여시오</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* heart-patterns.png 이미지를 패턴 형태로 타일링하여 배경 적용 */
            background-image: url('heart-patterns.png');
            background-repeat: repeat;
            background-position: center;
            background-size: 280px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 3D 스테이지 */
        .stage {
            perspective: 1000px;
            width: 96vw;
            max-width: 450px;
            height: 280px;
            position: relative;
        }

        /* 편지 봉투 전체 래퍼 */
        .envelope-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* 회전 부드러움 및 애니메이션 설정 */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        /* 봉투 면 (앞/뒤) */
        .envelope-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .front {
            background-image: url('envelope-front.png');
        }

        .back {
            background-image: url('envelope-back.png');
            transform: rotateY(180deg);
        }

        /* 열린 봉투 이미지 전환 */
        .envelope-wrapper.opened .front {
            background-image: url('envelope-open.png');
        }

        /* 봉투 열림 후 가운데 'TOUCH!' 문구 */
        .touch-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #00796b;
            padding: 10px 22px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 10;
            animation: pulse 1.5s infinite ease-in-out;
            pointer-events: auto;
        }

        .envelope-wrapper.opened .touch-prompt {
            display: block;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* 편지 모달 및 배경 효과 */
        .letter-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #F5F4F0;
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 70px 28px 50px 28px;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.08);
        }

        .letter-full.active {
            display: flex;
        }

        /* X 닫기 버튼 */
        .close-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 38px;
            height: 38px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #444;
            cursor: pointer;
            z-index: 101;
            transition: background 0.2s ease;
        }

        .close-btn:active {
            background: rgba(0, 0, 0, 0.15);
        }

        /* 편지 본문 스타일 */
        .letter-content {
            font-size: 16px;
            line-height: 1.8;
            color: #2b2b2b;
            word-break: keep-all;
        }

        .letter-content h1 {
            margin-bottom: 24px;
            color: #00796b;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope-face front"></div>
            <div class="envelope-face back"></div>
            <div class="touch-prompt" id="touchPrompt">TOUCH!</div>
        </div>
    </div>

    <!-- 전체 화면 편지 -->
    <div class="letter-full" id="fullLetter">
        <div class="close-btn" id="closeBtn">✕</div>
        <div class="letter-content">
            <h1>🎉 생일 축하해!</h1>
            <p>사랑하는 최팡만에게,</p><br>
            <p>여기에 준비한 생일 편지 텍스트를 작성하시면 됩니다.</p><br>
            <p>내용이 길어지면 모바일 화면에서 손가락으로 위아래 스크롤을 하면서 편하게 읽을 수 있습니다.</p><br>
            <p>오늘 하루 세상에서 가장 feliz하고 즐거운 날이 되길 바라!</p>
        </div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const touchPrompt = document.getElementById('touchPrompt');
        const fullLetter = document.getElementById('fullLetter');
        const closeBtn = document.getElementById('closeBtn');

        let startX = 0;
        let startY = 0;
        let isOpen = false;
        let currentRotation = 0; // 누적 회전 각도 변수

        envelope.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        envelope.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = endX - startX;
            const diffY = endY - startY;

            const isSwipeX = Math.abs(diffX) > 25 && Math.abs(diffX) > Math.abs(diffY);
            const isSwipeY = Math.abs(diffY) > 25 && Math.abs(diffY) > Math.abs(diffX);

            // 1. 누적 각도 방식의 양방향 자연스러운 좌/우 회전
            if (isSwipeX) {
                if (diffX < 0) {
                    // 우 -> 좌 스와이프: 손가락 따라 왼쪽으로 180도 추가 회전
                    currentRotation -= 180;
                } else {
                    // 좌 -> 우 스와이프: 손가락 따라 오른쪽으로 180도 추가 회전
                    currentRotation += 180;
                }
                envelope.style.transform = `rotateY(${currentRotation}deg)`;
                return;
            }

            // 2. 위로 스와이프 -> 봉투 열기
            if (isSwipeY && diffY < 0 && !isOpen) {
                openEnvelope();
                return;
            }

            // 3. 아래로 스와이프 -> 닫힌 봉투로 복구
            if (isSwipeY && diffY > 0 && isOpen) {
                closeEnvelope();
                return;
            }

            
        });

        function openEnvelope() {
            // 봉투가 열릴 때는 각도를 정면(0도)으로 정렬 후 열림
            currentRotation = 0;
            envelope.style.transform = `rotateY(0deg)`;
            envelope.classList.add('opened');
            isOpen = true;
        }

        function closeEnvelope() {
            envelope.classList.remove('opened');
            isOpen = false;
        }

        touchPrompt.addEventListener('click', (e) => {
            e.stopPropagation();
            fullLetter.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            fullLetter.classList.remove('active');
        });
    </script>
</body>
</html>
